<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureConvert | Multi-Factor Secure File Conversion</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    .card {
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .drop-zone {
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 2.5rem 1rem;
      margin: 1.5rem 0;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: rgba(59, 130, 246, 0.2);
    }
    input[type="email"], input[type="password"], input[type="text"], select {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      background: #334155;
      color: white;
      border: 1px solid #475569;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 1rem;
      font-size: 0.85rem;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <!-- Card 1: 2-Step Authentication -->
  <div class="card" id="authCard">
    <h2 style="margin-top: 0;">🔐 2-Step Authentication</h2>
    
    <!-- Registration/Login Step 1 Form -->
    <div id="step1Box">
      <input type="email" id="authEmail" placeholder="Email Address" autocomplete="off">
      <input type="password" id="authPassword" placeholder="Password (min 8 chars)" autocomplete="off">
      <div style="display: flex; gap: 0.5rem;">
        <button type="button" id="regBtn" style="background: #475569;">Register</button>
        <button type="button" id="login1Btn">Step 1: Password Login</button>
      </div>
    </div>

    <!-- Step 2 Form (TOTP 2FA) -->
    <div id="step2Box" style="display: none;">
      <p style="font-size: 0.85rem; color: #94a3b8;">Enter 6-digit TOTP code from Authenticator App:</p>
      <input type="text" id="totpCode" placeholder="123456" maxlength="6" autocomplete="off">
      <button type="button" id="login2Btn">Step 2: Verify TOTP Code</button>
    </div>

    <!-- 2FA Secret Key Display Container -->
    <div id="mfaDisplay" style="display: none; margin-top: 15px; padding: 10px; background: #334155; border-radius: 6px;">
      <p style="margin: 0; color: #94a3b8; font-size: 0.85rem;">Your 2FA Secret Key (Save this):</p>
      <strong id="mfaSecretKey" style="color: #38bdf8; font-size: 1rem; word-break: break-all;"></strong>
    </div>

    <div class="status-msg" id="authStatus"></div>
  </div>

  <!-- Card 2: Converter Dashboard (Hidden until logged in) -->
  <div class="card" id="dashboardCard" style="display: none;">
    <h2 style="margin-top: 0;">🔒 User Dashboard</h2>
    <p style="font-size: 0.85rem; color: #94a3b8;">Ephemeral, In-Memory File Processing</p>

    <div class="drop-zone" id="dropZone">
      <p id="fileLabel">Drag & drop a file here or click to select</p>
      <input type="file" id="fileInput" hidden>
    </div>

    <label for="formatSelect" style="display: block; text-align: left; font-size: 0.85rem; margin-bottom: 0.4rem; color: #94a3b8;">Choose Output Format:</label>
    <select id="formatSelect">
      <option value="html">Convert Text/Markdown to HTML (.html)</option>
      <option value="csv">Convert JSON to CSV (.csv)</option>
    </select>

    <button type="button" id="uploadBtn">Upload & Convert</button>

    <div class="status-msg" id="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
